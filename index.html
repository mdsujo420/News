<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adult News Today - 24/7 Live Updates</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f0f; color: #e0e0e0; margin: 0; padding-bottom: 80px; }
        
        header { background: linear-gradient(135deg, #1a1a1a, #2a0808); padding: 30px 20px; text-align: center; border-bottom: 4px solid #ff3333; box-shadow: 0 4px 15px rgba(255, 51, 51, 0.2); }
        header h1 { margin: 0; color: #ff3333; font-size: 32px; text-transform: uppercase; letter-spacing: 1px; }
        header p { margin: 8px 0 0; color: #aaa; font-size: 14px; }
        
        .container { max-width: 750px; margin: 30px auto; padding: 0 15px; }
        
        .news-card { background: #1a1a1a; margin-bottom: 25px; padding: 20px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.5); border: 1px solid #2c2c2c; transition: transform 0.2s; }
        .news-card:hover { transform: translateY(-3px); border-color: #ff3333; }
        
        .news-card img { width: 100%; height: auto; border-radius: 8px; margin-top: 15px; object-fit: cover; max-height: 400px; }
        .news-card h2 { font-size: 22px; margin-top: 0; color: #ff6666; line-height: 1.4; }
        .news-card p { color: #cccccc; font-size: 15px; line-height: 1.6; }
        
        .ads-box { background: #151515; padding: 12px; text-align: center; margin: 15px 0; border: 1px dashed #444; border-radius: 6px; font-size: 13px; color: #888; }
        
        .sticky-footer-ad { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(20, 20, 20, 0.95); text-align: center; padding: 10px 0; border-top: 1px solid #333; z-index: 999; box-shadow: 0 -4px 10px rgba(0,0,0,0.5); }
        
        .loading { text-align: center; color: #777; font-size: 16px; margin-top: 50px; }
    </style>
</head>
<body>

    <header>
        <h1 id="site-title">Adult News Today</h1>
        <p>24/7 Automated Real-Time Updates</p>
        <div class="ads-box" id="header-ad-box" style="margin-top: 15px;">Loading Header Ad...</div>
    </header>

    <div class="container" id="news-container">
        <div class="loading">Loading latest news...</div>
    </div>

    <div class="sticky-footer-ad" id="footer-ad-box">
        Loading Sticky Ad...
    </div>

    <script>
        // কনফিগারেশন এবং অ্যাড লোড করা
        fetch('config.json')
            .then(response => response.json())
            .then(config => {
                document.getElementById('site-title').innerText = config.site_name;
                document.getElementById('header-ad-box').innerHTML = config.ads.header_ad;
                document.getElementById('footer-ad-box').innerHTML = config.ads.footer_sticky_ad;
            }).catch(err => console.log('Config load error:', err));

        // নিউজ লোড করা
        fetch('news.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('news-container');
                if(data.length === 0) {
                    container.innerHTML = '<p class="loading">No news available right now. Please wait for the bot to generate.</p>';
                    return;
                }
                container.innerHTML = '';
                data.forEach(news => {
                    let card = document.createElement('div');
                    card.className = 'news-card';
                    card.innerHTML = `
                        <h2>${news.title}</h2>
                        <p>${news.summary}</p>
                        ${news.image && news.image !== "#" ? `<img src="${news.image}" alt="News Image">` : ''}
                        <div class="ads-box">${news.ad}</div>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(error => {
                document.getElementById('news-container').innerHTML = '<p class="loading">No news available right now. Run the bot to generate posts.</p>';
            });
    </script>

</body>
</html>
